name: Build CloudAmp APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: android

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download Gradle Wrapper JAR
      run: |
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar

    - name: Decode release keystore
      run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore

    - name: Build Release APK
      run: |
        ./gradlew assembleRelease --stacktrace --no-daemon \
          -PGOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
          -PRELEASE_KEYSTORE_PATH=keystore/release.keystore \
          -PRELEASE_KEYSTORE_PASSWORD="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
          -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
          -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"

    - name: Get version info
      id: version
      run: |
        VERSION_CODE=$(./gradlew -q printVersionCode | tail -1)
        VERSION_NAME=$(./gradlew -q printVersionName | tail -1)
        echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Version: $VERSION_NAME ($VERSION_CODE)"

    - name: Rename APK with version
      run: |
        VERSION_CODE="${{ steps.version.outputs.code }}"
        cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CloudAmp-v${VERSION_CODE}.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CloudAmp-v${{ steps.version.outputs.code }}
        path: android/app/build/outputs/apk/release/CloudAmp-v${{ steps.version.outputs.code }}.apk
        retention-days: 30

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        token_format: access_token

    - name: Upload to Firebase App Distribution
      run: |
        npm install -g firebase-tools
        NOTES="Version ${{ steps.version.outputs.name }}"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          NOTES="$NOTES (PR #${{ github.event.number }}: ${{ github.event.pull_request.title }})"
        else
          NOTES="$NOTES - ${{ github.event.head_commit.message }}"
        fi
        firebase appdistribution:distribute \
          android/app/build/outputs/apk/release/CloudAmp-v${{ steps.version.outputs.code }}.apk \
          --app "${{ secrets.FIREBASE_APP_ID }}" \
          --groups "testers" \
          --release-notes "$NOTES" \
          --token "${{ steps.auth.outputs.access_token }}"
      working-directory: .

    - name: Upload APK Summary
      run: |
        echo "### ✅ APK Built Successfully! 🎵" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ steps.version.outputs.name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Version Code:** ${{ steps.version.outputs.code }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Download your CloudAmp APK from the Artifacts section above.**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build type:** Release (signed, minified)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        ls -lh app/build/outputs/apk/release/CloudAmp-v${{ steps.version.outputs.code }}.apk >> $GITHUB_STEP_SUMMARY
