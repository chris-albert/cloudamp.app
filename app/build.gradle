plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def getVersionCode() {
    // Use compact timestamp for auto-incrementing version code
    // Format: MMDDHHMM (e.g., 01241628 for Jan 24 at 16:28)
    // Max value: 12311259 (fits within Integer.MAX_VALUE)
    def date = new Date()
    def formattedDate = date.format('MMddHHmm')
    return formattedDate.toInteger()
}

def versionCodeValue = getVersionCode()
def versionNameValue = "1.0." + versionCodeValue

android {
    namespace 'com.cloudamp.music'
    compileSdk 34

    defaultConfig {
        applicationId "com.cloudamp.music"
        minSdk 26
        targetSdk 34
        versionCode versionCodeValue
        versionName versionNameValue
    }

    signingConfigs {
        debug {
            storeFile file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'cloudamp'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Media and Android Auto
    implementation 'androidx.media:media:1.7.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'
}

// Task to print version code for CI/CD
tasks.register('printVersionCode') {
    doLast {
        println versionCodeValue
    }
}

// Task to print version name for CI/CD
tasks.register('printVersionName') {
    doLast {
        println versionNameValue
    }
}
